<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rally Team — dispositivo</title><link rel="stylesheet" href="/styles.css"></head>
<body class="device-page"><main class="device-card"><div class="brand-mark">RT</div><p class="eyebrow">Rally Team Online</p><h1>Escolha sua versão</h1><p>A interface do jogo se adapta à tela, mas você pode escolher o modo de apresentação.</p><div class="device-actions"><button id="desktop">🖥 Versão Desktop</button><button id="mobile">📱 Versão Mobile</button></div></main><script>
function choose(v){localStorage.setItem('rallyTeamLayout',v);location.href='/index.html';}
document.querySelector('#desktop').onclick=()=>choose('desktop');document.querySelector('#mobile').onclick=()=>choose('mobile');
</script></body></html>
